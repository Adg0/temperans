# Copy this item into the `habits:` list in Habit Logs/Settings.md.
# Replace YOUR_USERNAME with the username from the public profile.
- id: duolingo-streak
  name: Duolingo streak
  unit: days
  cadence: daily
  enabled: true
  type: tracker
  endpoint:
    sourceName: duolingo
    url: "https://www.duolingo.com/2017-06-30/users?username=YOUR_USERNAME"
    auth:
      type: none
    response:
      recordsPath: users.0
      dateField: "{{today}}"
      valueField: streak
      aggregation: latest
